# Packaging

package:
  extends: .deb-package
  stage: build and unit tests
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  variables:
    PROJECT_NAME: ocudu
    RELEASE_VERSION: "99.9"
    extraopts: -DMARCH=x86-64-v3
    GIT_STRATEGY: fetch
  tags:
    - ${OCUDU_RUNNER_TAG}-amd64
  before_script:
    - |
      CPU_JOBS="$(/usr/local/bin/get_available_cores.sh 2>/dev/null || ${CI_PROJECT_DIR}/.gitlab/ci/builders/get_available_cores.sh)"
      if [ -z "${CPU_JOBS}" ] || [ "${CPU_JOBS}" -lt 1 ]; then
        CPU_JOBS=1
      fi
      export CPU_JOBS
      export MAKEFLAGS="-j${CPU_JOBS}"
      export DEB_BUILD_OPTIONS="parallel=${CPU_JOBS}"
  parallel:
    matrix:
      - OS_VERSION: "24.04"
      - OS_VERSION: "26.04"
      - OS_VERSION: "26.10"
  needs: []

install-package:
  extends: .deb-install
  stage: build and unit tests
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  variables:
    PROJECT_NAME: ocudu
    RELEASE_VERSION: "99.9"
  tags:
    - ${OCUDU_RUNNER_TAG}-amd64
  script:
    - gnb --version
  parallel:
    matrix:
      - OS_VERSION: "24.04"
      - OS_VERSION: "26.04"
      - OS_VERSION: "26.10"
  needs:
    - package

