include:
  - project: ocudu/ocudu_packaging
    ref: "main"
    file: .gitlab/ci-shared/package.yml
  - local: .gitlab/ci-shared/build.yml
  - local: .gitlab/ci-shared/docker.yml

variables:
  OCUDU_PACKAGING_REGISTRY_URI: ${CI_REGISTRY}/ocudu/ocudu_packaging

################
# Build caches #
################

.cache_build_get: &cache_build_get
  - key: ${OS}-${COMPILER}-${CMAKE_BUILD_TYPE}-${MARCH}
    paths: [ccache]
    policy: pull-push

#################
# Template jobs #
#################

# Base job

.build_and_unit:
  extends: .build_and_unit_template
  stage: build and unit tests
  needs:
    - job: trigger builder
      optional: true
      artifacts: false
  variables:
    TEST_EXECUTION_TIMEOUT: 0
    ENABLE_SPLIT_DWARF: "True"
    UBSAN_OPTIONS: "print_stacktrace=1"
  script:
    - &script_functions |
      build_ocudu_extended() {
        target="$1"
        build_ocudu
        if [[ -n "$OUTPUT_FINGERPRINT" ]]; then
          echo "Storing fingerprints of all executables to $OUTPUT_FINGERPRINT"
          cd ${OCUDU_BUILD_DIR}
          /usr/local/builder_tools/bin/python /usr/local/bin/changed_tests.py -b . -o "../$OUTPUT_FINGERPRINT"
          cd ..
        fi
      }

      launch_tests_ocudu_extended() {
        cd ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}
        if [ -n "${FINGERPRINT}" ]; then
          echo "Searching for changed tests"
          CTEST_SUBSET=$(/usr/local/builder_tools/bin/python /usr/local/bin/changed_tests.py -b . -i "../${FINGERPRINT}" -d md5)
          if [ -n "${CTEST_SUBSET}" ]; then
            echo "Tests with changed fingerprint: ${CTEST_SUBSET}"
            CTEST_ARGS="-I 0,0,0,${CTEST_SUBSET} ${CTEST_ARGS}"
          else
            echo "No tests changed"
            ret=0
            exit $ret
          fi
        fi
        # Shard tests by stride across `parallel: N` jobs
        if [[ "${CTEST_SHARDED}" == "True" && "${CI_NODE_TOTAL:-1}" -gt 1 ]]; then
          CTEST_ARGS="${CTEST_ARGS} -I ${CI_NODE_INDEX},,${CI_NODE_TOTAL}"
        fi
        export -f launch_tests_ocudu
        status_file=$(mktemp)
        timeout ${TEST_EXECUTION_TIMEOUT} \
          bash -c "launch_tests_ocudu; echo \$? > ${status_file}" \
          && ret=$(cat ${status_file}) || ret=124

        if [[ $TEST_MODE = "coverage" ]]; then
          # gcovr must use a gcov tool that matches the compiler that produced
          # the coverage data. clang emits LLVM-format .gcno/.gcda files that
          # plain gcov cannot parse, so it needs 'llvm-cov gcov'. gcc uses the
          # default gcov. gcovr runs the gcov tool as a subprocess (not via the
          # shell), and $common_options is passed unquoted (word-split), so a
          # two-word "llvm-cov gcov" value cannot be passed directly. Write a
          # single-word wrapper executable and point --gcov-executable at it.
          if [[ "${COMPILER}" == "clang" ]]; then
            gcov_wrapper="$(mktemp -d)/llvm-cov-gcov"
            printf '#!/usr/bin/env bash\nexec llvm-cov gcov "$@"\n' > "${gcov_wrapper}"
            chmod +x "${gcov_wrapper}"
            GCOV_EXEC="--gcov-executable ${gcov_wrapper}"
          else
            GCOV_EXEC=""
          fi

          common_options="-j${CPU_JOBS} ${GCOV_EXEC} \
            --exclude-unreachable-branches \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --exclude=${CI_PROJECT_DIR}/tests/* \
            --exclude=${CI_PROJECT_DIR}/apps/* \
            --exclude=${CI_PROJECT_DIR}/external/* \
            --exclude=${CI_PROJECT_DIR}/include/ocudu/asn1/e1ap/.* \
            --exclude=${CI_PROJECT_DIR}/include/ocudu/asn1/e2ap/.* \
            --exclude=${CI_PROJECT_DIR}/include/ocudu/asn1/f1ap/.* \
            --exclude=${CI_PROJECT_DIR}/include/ocudu/asn1/ngap/.* \
            --exclude=${CI_PROJECT_DIR}/include/ocudu/asn1/nrppa/.* \
            --exclude=${CI_PROJECT_DIR}/include/ocudu/asn1/rrc_nr/.* \
            --exclude=${CI_PROJECT_DIR}/include/ocudu/asn1/xnap/.* \
            --exclude=${CI_PROJECT_DIR}/lib/asn1/e1ap/.* \
            --exclude=${CI_PROJECT_DIR}/lib/asn1/e2ap/.* \
            --exclude=${CI_PROJECT_DIR}/lib/asn1/f1ap/.* \
            --exclude=${CI_PROJECT_DIR}/lib/asn1/ngap/.* \
            --exclude=${CI_PROJECT_DIR}/lib/asn1/nrppa/.* \
            --exclude=${CI_PROJECT_DIR}/lib/asn1/rrc_nr/.* \
            --exclude=${CI_PROJECT_DIR}/lib/asn1/xnap/.* \
            --exclude-lines-by-pattern \".*ocudu_assert.*|.*ocudu_sanity_check.*\" \
            --root=${CI_PROJECT_DIR} \
            --gcov-ignore-parse-errors=all \
            --merge-mode-functions=merge-use-line-min"

          echo "+ gcovr: Coverage generation"
          if ! output=$(gcovr $common_options --keep 2>&1); then
            echo "gcovr FAILED!"
          fi

          # GitLab rejects any single coverage artifact over 10MB. The full
          # non-phy/scheduler coverage exceeds that once real data is produced,
          # so it is split into two files along a stable subsystem seam:
          #   coverage_1.xml - L2/L3 stack and control plane
          #   coverage_3.xml - everything else (support, ran, ofh, ru, etc.)
          #   coverage_2.xml - phy and scheduler (largest single subsystems)
          # Each gcovr run filters to its own subset so no file holds the whole
          # tree. Keep the seams in sync if a large new lib/ subsystem is added.
          stack_filters="--filter=${CI_PROJECT_DIR}/lib/du/.* \
            --filter=${CI_PROJECT_DIR}/lib/cu_cp/.* \
            --filter=${CI_PROJECT_DIR}/lib/cu_up/.* \
            --filter=${CI_PROJECT_DIR}/lib/mac/.* \
            --filter=${CI_PROJECT_DIR}/lib/rlc/.* \
            --filter=${CI_PROJECT_DIR}/lib/pdcp/.* \
            --filter=${CI_PROJECT_DIR}/lib/rrc/.* \
            --filter=${CI_PROJECT_DIR}/lib/f1ap/.* \
            --filter=${CI_PROJECT_DIR}/lib/f1u/.* \
            --filter=${CI_PROJECT_DIR}/lib/ngap/.* \
            --filter=${CI_PROJECT_DIR}/lib/e1ap/.* \
            --filter=${CI_PROJECT_DIR}/lib/e2/.* \
            --filter=${CI_PROJECT_DIR}/lib/gtpu/.* \
            --filter=${CI_PROJECT_DIR}/lib/nru/.* \
            --filter=${CI_PROJECT_DIR}/lib/sdap/.* \
            --filter=${CI_PROJECT_DIR}/lib/security/.* \
            --filter=${CI_PROJECT_DIR}/lib/nrppa/.* \
            --filter=${CI_PROJECT_DIR}/lib/lpp/.* \
            --filter=${CI_PROJECT_DIR}/lib/xnap/.* \
            --filter=${CI_PROJECT_DIR}/lib/psup/.* \
            --filter=${CI_PROJECT_DIR}/lib/rohc/.*"

          # coverage_1.xml: L2/L3 stack and control plane.
          if ! output=$(gcovr $common_options --xml --print-summary --use-gcov-files --keep \
            $stack_filters \
            -o coverage_1.xml 2>&1); then
            echo "gcovr coverage_1.xml FAILED!"
            echo "$output"
            ret=1
          fi

          # coverage_3.xml: everything not covered by the stack or phy/scheduler.
          if ! output=$(gcovr $common_options --xml --print-summary --use-gcov-files --keep \
            --exclude="${CI_PROJECT_DIR}/lib/phy/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/scheduler/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/du/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/cu_cp/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/cu_up/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/mac/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/rlc/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/pdcp/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/rrc/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/f1ap/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/f1u/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/ngap/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/e1ap/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/e2/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/gtpu/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/nru/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/sdap/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/security/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/nrppa/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/lpp/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/xnap/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/psup/.*" \
            --exclude="${CI_PROJECT_DIR}/lib/rohc/.*" \
            -o coverage_3.xml 2>&1); then
            echo "gcovr coverage_3.xml FAILED!"
            echo "$output"
            ret=1
          fi

          # coverage_2.xml: phy and scheduler.
          if ! output=$(gcovr $common_options --xml --print-summary --use-gcov-files --keep \
            --filter="${CI_PROJECT_DIR}/lib/phy/.*" \
            --filter="${CI_PROJECT_DIR}/lib/scheduler/.*" \
            -o coverage_2.xml 2>&1); then
            echo "gcovr coverage_2.xml FAILED!"
            echo "$output"
            ret=1
          fi

          echo "Generated coverage files:"
          ls -lh coverage*.xml 2>/dev/null || true

          # Check that no coverage file exceeds 10MB GitLab limit
          maxsize=$((10*1024*1024))
          for covfile in coverage*.xml; do
            if [ -f "$covfile" ]; then
              filesize=$(stat -c%s "$covfile")
              if (( filesize > maxsize )); then
                echo "ERROR: $covfile is $(( filesize / 1024 / 1024 ))MB, exceeds 10MB GitLab limit!"
                ret=1
              fi
            fi
          done
        fi

        if [ $ret -eq 124 ]; then
          echo "The test execution exceeded the maximum allowed time !!!!"
        fi

        exit $ret
      }

    - build_ocudu_extended
    - launch_tests_ocudu_extended
  timeout: 3 hours
  after_script:
    - xunit_name=ctest; [ -n "${OCUDU_TEST_REQUIREMENT_REPORTS}" ] && xunit_name=xunit
    - mv ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/coverage_1.xml    ${CI_PROJECT_DIR}/${CI_JOB_ID}_coverage_1.xml           || true
    - mv ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/coverage_2.xml    ${CI_PROJECT_DIR}/${CI_JOB_ID}_coverage_2.xml           || true
    - mv ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/coverage_3.xml    ${CI_PROJECT_DIR}/${CI_JOB_ID}_coverage_3.xml           || true
    - mv ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/xunit.xml         ${CI_PROJECT_DIR}/${CI_JOB_ID}_${xunit_name}.xml        || true
    - mv ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/ctest_output.log  ${CI_PROJECT_DIR}/${CI_JOB_ID}_ctest_output.log         || true
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${CI_JOB_ID}_coverage*.xml
      junit:
        - ${CI_JOB_ID}_ctest.xml
        - ${CI_JOB_ID}_xunit.xml
    paths:
      - ${CI_JOB_ID}_coverage*.xml
      - ${CI_JOB_ID}_ctest.xml
      - ${CI_JOB_ID}_xunit.xml
      - ${CI_JOB_ID}_ctest_output.log
      - ${OCUDU_BUILD_DIR}/Testing/Temporary/MemoryChecker.*.log
    expire_in: 5 days

# Basic builds (MR and update cache on Nightly)

.smoke coverage:
  extends: .build_and_unit
  variables:
    OS: ubuntu-26.04
    COMPILER: clang
    CMAKE_BUILD_TYPE: Release
    ASSERT_LEVEL: PARANOID
    ENABLE_FFTW: "True"
    TEST_MODE: coverage
    ENABLE_GCOV: "True"
    MARCH: x86-64-v3
    LINKER: mold
    OCUDU_TEST_REQUIREMENT_REPORTS: "True"

.smoke relwithdeb:
  extends: .build_and_unit
  variables:
    OS: ubuntu-26.04
    COMPILER: gcc
    CMAKE_BUILD_TYPE: RelWithDebInfo
    ASSERT_LEVEL: PARANOID
    ENABLE_FFTW: "True"
    ENABLE_UHD: "True"
    ENABLE_ZEROMQ: "True"
    ENABLE_DPDK: "True"
    DPDK_VERSION: "25.11.3_avx2"
    ENABLE_SCHEDTRACE: "True"
    TEST_MODE: default
    MARCH: x86-64-v3
    LINKER: mold

.smoke tsan:
  extends: .build_and_unit
  variables:
    OS: ubuntu-26.04
    COMPILER: clang
    CMAKE_BUILD_TYPE: Debug
    ASSERT_LEVEL: PARANOID
    ENABLE_FFTW: "True"
    ENABLE_TSAN: "True"
    TEST_MODE: tsan
    MARCH: x86-64-v3
    LINKER: mold

.smoke asan:
  extends: .build_and_unit
  variables:
    OS: ubuntu-26.04
    COMPILER: clang
    CMAKE_BUILD_TYPE: Debug
    ASSERT_LEVEL: PARANOID
    ENABLE_FFTW: "True"
    ENABLE_ASAN: "True"
    MARCH: x86-64-v3
    LINKER: mold

.smoke rtsan:
  extends: .build_and_unit
  variables:
    OS: ubuntu-26.04
    COMPILER: clang
    CMAKE_BUILD_TYPE: Release
    FORCE_DEBUG_INFO: "True"
    ASSERT_LEVEL: AUTO
    ENABLE_FFTW: "True"
    ENABLE_UHD: "False"
    ENABLE_ZEROMQ: "False"
    ENABLE_DPDK: "True"
    ENABLE_RTSAN: "True"
    DPDK_VERSION: "25.11.3_avx2"
    ENABLE_SCHEDTRACE: "True"
    TEST_MODE: rtsan
    MARCH: x86-64-v3
    LINKER: mold

.smoke valgrind:
  extends: .build_and_unit
  variables:
    OS: ubuntu-24.04
    COMPILER: gcc
    CMAKE_BUILD_TYPE: Debug
    ASSERT_LEVEL: PARANOID
    ENABLE_FFTW: "True"
    TEST_MODE: valgrind
    MARCH: x86-64-v3

.smoke printers:
  extends: .build_and_unit
  variables: &gdb_printers_variables
    OS: ubuntu-24.04
    OCUDU_TARGET: pretty_printer_tests
    COMPILER: gcc
    CMAKE_BUILD_TYPE: Debug
    ASSERT_LEVEL: PARANOID
    ENABLE_FFTW: "True"
    TEST_GDB_PRINTERS: "True"
    TEST_MODE: pretty_printers
    MARCH: x86-64-v3
    LINKER: mold

.smoke archlinux:
  extends: .build_and_unit
  variables:
    OS: archlinux-latest
    ENABLE_WERROR: "False"
    COMPILER: gcc
    CMAKE_BUILD_TYPE: Debug
    ASSERT_LEVEL: PARANOID
    ENABLE_FFTW: "True"
    ENABLE_EXPORT: "True"
    TEST_MODE: default
    MARCH: x86-64-v3
    LINKER: mold

.smoke old clang:
  extends: .build_and_unit
  variables:
    OS: ubuntu-24.04
    COMPILER: clang
    CMAKE_BUILD_TYPE: Release
    ASSERT_LEVEL: NONE
    TEST_MODE: default
    MARCH: x86-64-v3

.smoke cuda:
  extends: .build_and_unit
  image: nvidia/cuda:12.9.2-devel-ubuntu24.04
  tags:
    - saas-linux-medium-amd64-gpu-standard
  variables:
    OS: ubuntu-24.04
    ENABLE_CUDA: "True"
    MARCH: x86-64-v3
    TEST_MODE: cuda
  before_script:
    - ${CI_PROJECT_DIR}/docker/scripts/install_dependencies.sh
    - apt-get install -y --no-install-recommends ccache ninja-build lld
    - cp ${CI_PROJECT_DIR}/docker/scripts/builder.sh ${CI_PROJECT_DIR}/.gitlab/ci/builders/add_junit_properties.py /usr/local/bin/ && chmod +x /usr/local/bin/builder.sh /usr/local/bin/add_junit_properties.py
    - |
      command -v curl >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends ca-certificates curl; }
      export VKFFT_ROOT=/opt/vkfft
      mkdir -p "${VKFFT_ROOT}"
      curl -fsSL https://github.com/DTolm/VkFFT/archive/refs/heads/master.tar.gz | tar -xz -C "${VKFFT_ROOT}" --strip-components=1
    - !reference [.build_and_unit_template, before_script]

# Combinations to use in schedules matrix

.combinations: &basic_combinations
  COMPILER: [gcc, clang]
  CMAKE_BUILD_TYPE: [Release, RelWithDebInfo, Debug]
  ASSERT_LEVEL: [NONE, NORMAL, PARANOID]

.dpdk_combinations: &basic_combinations_dpdk
  <<: *basic_combinations
  ENABLE_UHD: "False"
  ENABLE_ZEROMQ: "False"
  ENABLE_DPDK: "True"
  COMPILER: [gcc, clang]

######
# MR #
######

# Smoke builds in PR: with or without cache

smoke relwithdeb cached:
  extends: .smoke relwithdeb
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
  cache:
    - *cache_build_get

smoke old clang cached:
  extends: .smoke old clang
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-old-clang/
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
  cache:
    - *cache_build_get

smoke archlinux cached:
  extends: .smoke archlinux
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
  cache:
    - *cache_build_get

smoke tsan cached:
  extends: .smoke tsan
  stage: extended
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke asan cached:
  extends: .smoke asan
  stage: extended
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke rtsan cached:
  extends: .smoke rtsan
  stage: extended
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke pretty printers cached:
  extends: .smoke printers
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      changes: &gdb_printers_changes
        paths:
          - include/ocudu/adt/**/*
          - tests/utils/gdb/pretty_printers/*
          - utils/gdb/**/*
          - .gdbinit
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke cuda cached:
  extends: .smoke cuda
  stage: extended
  rules:
    - if: $ON_MR_FORK
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      changes: &cuda_changes
        paths:
          # Any directory named cuda, which is where the kernels and the CUDA layer live.
          - "**/cuda/**/*"
          # The accelerated implementations outside those directories. They are named after
          # the technology, either cuda or gpu, wherever they sit beside their CPU siblings.
          - "lib/**/*cuda*"
          - "lib/**/*gpu*"
          - "include/**/*cuda*"
          - "include/**/*gpu*"
          - "tests/**/*cuda*"
          - "tests/**/*gpu*"
          - "apps/**/*cuda*"
          - "apps/**/*gpu*"
          - cmake/modules/add_cuda_test.cmake
          - cmake/modules/FindVkFFT.cmake
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke relwithdeb clean:
  extends: .smoke relwithdeb
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/

smoke old clang clean:
  extends: .smoke old clang
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-old-clang/
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/

smoke archlinux clean:
  extends: .smoke archlinux
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/

smoke tsan clean:
  extends: .smoke tsan
  stage: extended
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true

smoke asan clean:
  extends: .smoke asan
  stage: extended
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true

smoke rtsan clean:
  extends: .smoke rtsan
  stage: extended
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true

smoke pretty printers clean:
  extends: .smoke printers
  stage: extended
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      changes:
        <<: *gdb_printers_changes
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true

smoke cuda clean:
  extends: .smoke cuda
  stage: extended
  rules:
    - if: $ON_MR_FORK
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      changes:
        <<: *cuda_changes
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true
  cache: []

# Intermediate commits

intermediate commits cached:
  extends: .smoke coverage
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
  script:
    - *script_functions
    - &fetch_branches |
      cd $CI_PROJECT_DIR
      git config advice.detachedHead false
      unshallow_flag() {
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo --unshallow
        fi
      }
      if [ "$CI_PROJECT_PATH" = "$CI_MERGE_REQUEST_PROJECT_PATH" ]; then
        # job on target
        git fetch $(unshallow_flag) origin \
          "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/ci/mr-target" \
          "$CI_MERGE_REQUEST_REF_PATH:refs/ci/mr-source"
      else
        # job on the fork
        git fetch $(unshallow_flag) origin \
          "+refs/heads/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:refs/ci/mr-source"
        git remote get-url upstream >/dev/null 2>&1 || \
          git remote add upstream "$CI_MERGE_REQUEST_PROJECT_URL"
        git fetch $(unshallow_flag) upstream \
          "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/ci/mr-target"
      fi

      SOURCE_SHA=$(git rev-parse refs/ci/mr-source)
      FORK_POINT=$(git merge-base refs/ci/mr-source refs/ci/mr-target)
    - |
      revs=$(git rev-list --reverse $FORK_POINT..$SOURCE_SHA)
      if [ -z "$revs" ]; then
        echo "ERROR: no commits in $FORK_POINT..$SOURCE_SHA, nothing to build"
        exit 1
      fi
      for rev in $revs
      do
        echo "##################################################"
        echo "#### $rev ####"
        echo "##################################################"
        git checkout $rev
        build_ocudu_extended
      done
    - launch_tests_ocudu_extended
  cache:
    - *cache_build_get

intermediate commits clean:
  extends: intermediate commits cached
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
  cache: []

valgrind changed tests:
  extends: .smoke valgrind
  stage: extended
  allow_failure:
    exit_codes: 124 # timeout command's exit code when the time is reached
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-memcheck/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  variables:
    CLEAN_BUILD: "False"
    FINGERPRINT: "fingerprints.csv"
    TEST_EXECUTION_TIMEOUT: 20m
  script:
    - *script_functions
    - *fetch_branches
    - |
      echo "##################################################"
      echo "#### $FORK_POINT ####"
      echo "##################################################"
      git checkout $FORK_POINT
      OUTPUT_FINGERPRINT="${FINGERPRINT}"
      build_ocudu_extended
      OUTPUT_FINGERPRINT=""
    - |
      echo "##################################################"
      echo "#### $SOURCE_SHA ####"
      echo "##################################################"
      git checkout $SOURCE_SHA
      build_ocudu_extended
    - echo "This test execution has a timeout of ${TEST_EXECUTION_TIMEOUT}. If the execution excess that timer, the job will be marked as allowed_to_fail. This will avoid the job to have a huge duration in a MR pipeline."
    - launch_tests_ocudu_extended
  cache:
    - *cache_build_get

