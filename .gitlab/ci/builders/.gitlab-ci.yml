    - job: ubuntu-dpdk-builder arm64
      parallel:
        matrix:
          - os_version: "24.04"
            dpdk_version: ["23.11.4", "24.11.2", "25.11.3"]

manifest [ubuntu, 24.04]:
  extends: .manifest
  variables:
    OS_NAME: ubuntu
    OS_VERSION: "24.04"
  needs:
    - job: image-build-publish [ubuntu, 24.04, amd64]
      optional: false
    - job: image-build-publish [ubuntu, 24.04, arm64]
