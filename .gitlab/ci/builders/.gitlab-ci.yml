            uhd_version: ["4.9.0.0", "4.8.0.0", "4.7.0.0"] # "4.6.0.0" default
    - job: ubuntu-dpdk-builder avx2
      parallel:
        matrix:
          - os_version: "24.04"
            dpdk_version: ["23.11.4", "24.11.2", "25.11.3"]
    - job: ubuntu-dpdk-builder avx512
      parallel:
        matrix:
          - os_version: "24.04"
            dpdk_version: ["23.11.4", "24.11.2", "25.11.3"]

image-build-publish [ubuntu, 24.04, arm64]:
  extends:
