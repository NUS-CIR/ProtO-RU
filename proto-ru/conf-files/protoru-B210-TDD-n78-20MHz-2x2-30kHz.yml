# Common ProtO-RU profile: TDD n78, 20 MHz, 2x2, 30 kHz SCS.
# Use this file with either the matching OCUDU or OAI O-DU configuration where provided.
# Adapt interface names, MAC addresses, CPU sets, gains, and UHD arguments to the host.
log:
  filename: /tmp/proto-ru.log
  level: info

ru_emu:
  timing_cpus: [1]
  cells:
    - network_interface: ens1f0
      ru_mac_addr: 50:7c:6f:45:f3:04
      du_mac_addr: 00:11:22:33:44:77 # 50:7c:6f:55:c6:ae
      vlan_tag: 5

      bandwidth: 20
      common_scs: 30
      dl_arfcn: 628032
      band: 78

      dl_port_id: [0, 1]
      ul_port_id: [0, 1]
      prach_port_id: [4, 5]
      prach_format: short

      compr_method_dl: bfp
      compr_bitwidth_dl: 9
      compr_method_ul: bfp
      compr_bitwidth_ul: 9
      compr_method_prach: bfp
      compr_bitwidth_prach: 9
      is_ul_static_compr_hdr: true
      is_dl_static_compr_hdr: true
      iq_scaling: 1.0

      t2a_max_cp_dl: 2435
      t2a_min_cp_dl: 2235
      t2a_max_cp_ul: 2835 # 2435 (OCUDU), 2835 (OAI)
      t2a_min_cp_ul: 2235
      t2a_max_up: 2215
      t2a_min_up: 2015
      ta3_max_up: 1200
      ta3_min_up: 800

      ofh_cpus: [2, 3]

      sdr:
        device_driver: uhd
        device_args: type=b200,num_recv_frames=64,num_send_frames=64
        srate: 23.04
        tx_gain: 80
        rx_gain: 45
        gain_backoff: 12
        enable_clipping: true
        power_ceiling: -0.1
        clock_source: internal
        sync_source: internal
        max_proc_delay: 2
        execution_profile: auto
        ru_cpus: [4, 5, 6]
        pinning_policy: mask
